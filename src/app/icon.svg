<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo escuro (paleta dark #16130B) -->
  <rect width="64" height="64" rx="12" fill="#16130B"/>

  <!-- Rede neural de fundo: conexões -->
  <g stroke="#FFD700" stroke-opacity="0.22" stroke-width="0.8" fill="none">
    <line x1="8" y1="14" x2="18" y2="30"/>
    <line x1="8" y1="14" x2="30" y2="12"/>
    <line x1="18" y1="30" x2="30" y2="12"/>
    <line x1="30" y1="12" x2="46" y2="22"/>
    <line x1="18" y1="30" x2="46" y2="22"/>
    <line x1="46" y1="22" x2="56" y2="16"/>
    <line x1="30" y1="12" x2="56" y2="16"/>
    <line x1="56" y1="16" x2="52" y2="38"/>
    <line x1="46" y1="22" x2="52" y2="38"/>
    <line x1="8" y1="14" x2="14" y2="46"/>
    <line x1="18" y1="30" x2="14" y2="46"/>
    <line x1="14" y1="46" x2="30" y2="52"/>
    <line x1="14" y1="46" x2="48" y2="50"/>
    <line x1="30" y1="52" x2="48" y2="50"/>
    <line x1="52" y1="38" x2="48" y2="50"/>
    <line x1="48" y1="50" x2="58" y2="54"/>
    <line x1="30" y1="52" x2="34" y2="46"/>
  </g>

  <!-- Rede neural: nós -->
  <g fill="#FFD700" fill-opacity="0.5">
    <circle cx="8" cy="14" r="1.6"/>
    <circle cx="18" cy="30" r="1.4"/>
    <circle cx="30" cy="12" r="1.6"/>
    <circle cx="46" cy="22" r="1.4"/>
    <circle cx="56" cy="16" r="1.4"/>
    <circle cx="52" cy="38" r="1.5"/>
    <circle cx="14" cy="46" r="1.5"/>
    <circle cx="30" cy="52" r="1.3"/>
    <circle cx="48" cy="50" r="1.5"/>
    <circle cx="58" cy="54" r="1.2"/>
    <circle cx="34" cy="46" r="1.0"/>
  </g>

  <!-- Chip central -->
  <g>
    <!-- Corpo do chip (gold escuro #B8860B com brilho) -->
    <rect x="19" y="19" width="26" height="26" rx="4" fill="#B8860B"/>
    <rect x="21" y="21" width="22" height="22" rx="3" fill="#D4A017"/>
    <!-- Brilho superior -->
    <rect x="21" y="21" width="22" height="8" rx="3" fill="#FFD700" fill-opacity="0.35"/>

    <!-- Pinos laterais -->
    <g fill="#FFD700">
      <rect x="15" y="23" width="4" height="2.5" rx="0.5"/>
      <rect x="15" y="28.5" width="4" height="2.5" rx="0.5"/>
      <rect x="15" y="34" width="4" height="2.5" rx="0.5"/>
      <rect x="45" y="23" width="4" height="2.5" rx="0.5"/>
      <rect x="45" y="28.5" width="4" height="2.5" rx="0.5"/>
      <rect x="45" y="34" width="4" height="2.5" rx="0.5"/>
      <rect x="23" y="15" width="2.5" height="4" rx="0.5"/>
      <rect x="28.5" y="15" width="2.5" height="4" rx="0.5"/>
      <rect x="34" y="15" width="2.5" height="4" rx="0.5"/>
      <rect x="23" y="45" width="2.5" height="4" rx="0.5"/>
      <rect x="28.5" y="45" width="2.5" height="4" rx="0.5"/>
      <rect x="34" y="45" width="2.5" height="4" rx="0.5"/>
    </g>

    <!-- Texto DAO -->
    <text x="32" y="37.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#16130B" letter-spacing="0.5">DAO</text>
  </g>
</svg>
